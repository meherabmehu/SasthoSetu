name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  postgres:
    name: PostgreSQL migrations and concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review-test-only
          POSTGRES_DB: sasthosetu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d sasthosetu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Actual database checks
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          TEST_POSTGRES_URL: postgresql+psycopg2://review:review-test-only@127.0.0.1:5432/sasthosetu_test
        run: python -m unittest discover -s tests -p test_postgres_concurrency.py -v

  browser:
    name: Browser journeys and offline isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start isolated fixture application
        run: python tools/review_server.py > /tmp/sasthosetu-browser.log 2>&1 &
      - name: Wait for application
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=5)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Fixture server did not become ready')
          PY
      - run: python tools/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshot
          path: .tmp/browser-smoke.png

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff==0.17.3

      - name: Ruff
        run: ruff check backend ml scripts tools

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install uvicorn

      # The AI services load generated datasets and trained artifacts. Building
      # them here is what keeps the pipeline honest: if a generator or training
      # script breaks, CI fails rather than the endpoints failing in production.
      - name: Build datasets and train models
        run: python ml/prepare_all.py

      - name: Run migrations against a clean database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: alembic upgrade head

      - name: Test suite
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: python -m unittest discover -s tests -v

      - name: Upload model metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: |
            backend/app/ai/artifacts/*.json
            backend/app/ai/artifacts/*.csv
          if-no-files-found: ignore

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install uvicorn

      - name: Build datasets and train models
        run: python ml/prepare_all.py

      - name: Prepare database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./smoke.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: alembic upgrade head

      - name: Seed reference data
        env:
          DATABASE_URL: sqlite:///./backend/smoke.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: python scripts/seed_database.py

      - name: Start the API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./smoke.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      # A red flag reaching the wrong triage level is the one defect class that
      # must never ship, so it is asserted against a running server too.
      - name: Verify emergency triage over HTTP
        run: |
          RESPONSE=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/triage \
            -H 'Content-Type: application/json' \
            -d '{"symptoms":"বুকে ব্যথা, শ্বাস নিতে কষ্ট","age_years":50}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"triage_level":"EMERGENCY"'

      - name: Verify the AI triage endpoint serves
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/ai/triage-ml \
            -H 'Content-Type: application/json' \
            -d '{"symptoms":"তিন দিন ধরে জ্বর ও কাশি","age_years":30}' | grep -q severity_level

      - name: Verify surge forecasting serves
        run: curl -fsS http://127.0.0.1:8000/api/v1/hospitals/H001/surge-forecast | grep -q forecast

      - name: Verify drug interaction screening serves
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/ai/drug-check \
            -H 'Content-Type: application/json' \
            -d '{"drugs":["Warfin","Ecosprin"]}' | grep -q '"highest_severity":"major"'

      - name: Verify FHIR conformance endpoint
        run: curl -fsS http://127.0.0.1:8000/api/v1/fhir/metadata | grep -q '4.0.1'
