# Serves the static frontend and proxies the API from the same origin, so the
# browser never makes a cross-origin request and the service worker can cache
# both under one scope.

upstream sasthosetu_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Bangla content compresses well, and the target users are on slow links.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://sasthosetu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API rate limits per client, so the original address must survive
        # the proxy hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    location = /health {
        proxy_pass http://sasthosetu_api/health;
        access_log off;
    }

    location = /docs { proxy_pass http://sasthosetu_api/docs; }
    location = /redoc { proxy_pass http://sasthosetu_api/redoc; }
    location = /openapi.json { proxy_pass http://sasthosetu_api/openapi.json; }

    # The worker must never be served stale, or clients can be pinned to an
    # old cache indefinitely.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /offline.html;
}
