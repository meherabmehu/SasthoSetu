<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b817d">
<title>লগইন · সাস্থ্যসেতু</title>
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css">
<link rel="stylesheet" href="assets/css/layout.css">
<style>
  /* The role chooser. Two big doors rather than a small link at the bottom
     of a patient form, so nobody signs up as the wrong kind of account. */
  .role-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2);
    margin-bottom: var(--space-4);
  }
  .role-door {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-1);
    padding: var(--space-4) var(--space-2);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    transition: border-color var(--transition), background var(--transition);
  }
  .role-door .role-icon { font-size: var(--text-2xl); }
  .role-door strong { font-size: var(--text-base); }
  .role-door span { font-size: var(--text-xs); color: var(--text-subtle); }
  .role-door[aria-pressed="true"] {
    border-color: var(--teal-600);
    background: var(--teal-50);
  }
  [data-theme="dark"] .role-door[aria-pressed="true"] { background: var(--teal-900); }
</style>
</head>
<body>
<main id="main" class="container">
  <div class="auth-shell">
    <div class="page-head text-center">
      <h1 data-i18n="app.name">সাস্থ্যসেতু</h1>
      <p class="muted" data-i18n="auth.chooseDoor">আপনি কে? নিচ থেকে বেছে নিন।</p>
    </div>

    <div class="role-switch" role="group" aria-label="Role">
      <button class="role-door" id="doorPatient" type="button" aria-pressed="true">
        <span class="role-icon" aria-hidden="true">🙋</span>
        <strong data-i18n="auth.asPatient">রোগী</strong>
        <span data-i18n="auth.asPatientHint">উপসর্গ পরীক্ষা, ডাক্তার খোঁজা</span>
      </button>
      <button class="role-door" id="doorDoctor" type="button" aria-pressed="false">
        <span class="role-icon" aria-hidden="true">🩺</span>
        <strong data-i18n="auth.asDoctor">চিকিৎসক</strong>
        <span data-i18n="auth.asDoctorHint">রোগী দেখা, সময়সূচি</span>
      </button>
    </div>

    <!-- রোগী -->
    <section id="patientArea">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabLogin" role="tab" aria-selected="true"
          aria-controls="loginPanel" data-i18n="auth.login">লগইন</button>
        <button class="tab" id="tabRegister" role="tab" aria-selected="false"
          aria-controls="registerPanel" data-i18n="auth.register">নতুন অ্যাকাউন্ট</button>
      </div>

      <section class="card" id="loginPanel" role="tabpanel" aria-labelledby="tabLogin">
        <form id="loginForm" novalidate>
          <div class="field">
            <label class="label" for="loginEmail" data-i18n="auth.email">ইমেইল</label>
            <input id="loginEmail" class="input" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label class="label" for="loginPassword" data-i18n="auth.password">পাসওয়ার্ড</label>
            <input id="loginPassword" class="input" type="password" required autocomplete="current-password">
          </div>
          <p class="error-text hidden" id="loginError" role="alert"></p>
          <button class="btn btn-block" id="loginBtn" type="submit" data-i18n="auth.login">লগইন</button>
        </form>
      </section>

      <section class="card hidden" id="registerPanel" role="tabpanel" aria-labelledby="tabRegister">
        <p class="small muted" data-i18n="auth.patientRegHint">
          রোগী হিসেবে খুলুন — উপসর্গ পরীক্ষা, ডাক্তার খোঁজা ও অ্যাপয়েন্টমেন্টের জন্য।</p>
        <form id="registerForm" novalidate>
          <div class="field">
            <label class="label" for="regName" data-i18n="auth.name">পুরো নাম</label>
            <input id="regName" class="input" required autocomplete="name" minlength="2">
          </div>
          <div class="field">
            <label class="label" for="regEmail" data-i18n="auth.email">ইমেইল</label>
            <input id="regEmail" class="input" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label class="label" for="regPhone" data-i18n="auth.phone">মোবাইল নম্বর</label>
            <input id="regPhone" class="input" type="tel" required autocomplete="tel"
              pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX">
          </div>
          <div class="field">
            <label class="label" for="regPassword" data-i18n="auth.password">পাসওয়ার্ড</label>
            <input id="regPassword" class="input" type="password" required
              minlength="8" autocomplete="new-password">
          </div>
          <p class="error-text hidden" id="registerError" role="alert"></p>
          <button class="btn btn-block" id="registerBtn" type="submit" data-i18n="auth.register">নতুন অ্যাকাউন্ট</button>
        </form>
      </section>
    </section>

    <!-- চিকিৎসক -->
    <section id="doctorArea" class="hidden">
      <div class="tabs" role="tablist">
        <button class="tab" id="dTabLogin" role="tab" aria-selected="true"
          aria-controls="dLoginPanel" data-i18n="auth.login">লগইন</button>
        <button class="tab" id="dTabRegister" role="tab" aria-selected="false"
          aria-controls="dRegisterPanel" data-i18n="auth.doctorRegister">চিকিৎসক অ্যাকাউন্ট খুলুন</button>
      </div>

      <section class="card" id="dLoginPanel" role="tabpanel" aria-labelledby="dTabLogin">
        <form id="dLoginForm" novalidate>
          <div class="field">
            <label class="label" for="dLoginEmail" data-i18n="auth.email">ইমেইল</label>
            <input id="dLoginEmail" class="input" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label class="label" for="dLoginPassword" data-i18n="auth.password">পাসওয়ার্ড</label>
            <input id="dLoginPassword" class="input" type="password" required autocomplete="current-password">
          </div>
          <p class="error-text hidden" id="dLoginError" role="alert"></p>
          <button class="btn btn-block" id="dLoginBtn" type="submit" data-i18n="auth.login">লগইন</button>
        </form>
      </section>

      <section class="card hidden" id="dRegisterPanel" role="tabpanel" aria-labelledby="dTabRegister">
        <p class="small muted" data-i18n="auth.doctorRegHint">
          অ্যাকাউন্ট খুললেই প্রোফাইল তৈরি হবে, তবে বিএমডিসি নম্বর প্রশাসক যাচাই করার
          আগে রোগীরা আপনাকে দেখতে পাবে না।</p>
        <form id="dRegisterForm" novalidate>
          <div class="field">
            <label class="label" for="dRegName" data-i18n="auth.name">পুরো নাম</label>
            <input id="dRegName" class="input" required autocomplete="name" minlength="2">
          </div>
          <div class="field">
            <label class="label" for="dRegEmail" data-i18n="auth.email">ইমেইল</label>
            <input id="dRegEmail" class="input" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label class="label" for="dRegPhone" data-i18n="auth.phone">মোবাইল নম্বর</label>
            <input id="dRegPhone" class="input" type="tel" required autocomplete="tel"
              pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX">
          </div>
          <div class="field">
            <label class="label" for="dRegPassword" data-i18n="auth.password">পাসওয়ার্ড</label>
            <input id="dRegPassword" class="input" type="password" required
              minlength="8" autocomplete="new-password">
          </div>
          <div class="field">
            <label class="label" for="dRegBmdc" data-i18n="auth.bmdc">বিএমডিসি নম্বর</label>
            <input id="dRegBmdc" class="input" required minlength="4" maxlength="50"
              placeholder="BMDC-XXXXXXXX">
          </div>
          <div class="field">
            <label class="label" for="dRegSpec" data-i18n="auth.specialization">বিশেষত্ব</label>
            <input id="dRegSpec" class="input" required minlength="2" maxlength="100"
              data-i18n-placeholder="auth.specPlaceholder" placeholder="যেমন: মেডিসিন, কার্ডিওলজি">
          </div>
          <div class="field">
            <label class="label" for="dRegHospital" data-i18n="auth.hospital">হাসপাতাল / চেম্বারের নাম</label>
            <input id="dRegHospital" class="input" required minlength="2" maxlength="200">
          </div>
          <p class="error-text hidden" id="dRegisterError" role="alert"></p>
          <button class="btn btn-block" id="dRegisterBtn" type="submit"
            data-i18n="auth.doctorRegister">চিকিৎসক অ্যাকাউন্ট খুলুন</button>
        </form>
      </section>
    </section>
  </div>
</main>

<script type="module">
import { i18n } from './assets/js/i18n.js';
import { api, session } from './assets/js/api.js';
import { bootstrap } from './assets/js/page.js';
import { toast, setBusy } from './assets/js/ui.js';

bootstrap('login.html');

const params = new URLSearchParams(window.location.search);
const next = params.get('next');

function destinationFor(user) {
  if (next) return next;
  if (user?.role === 'DOCTOR') return 'doctor.html';
  if (user?.role === 'ADMIN') return 'admin.html';
  return 'index.html';
}

if (session.isAuthenticated) {
  window.location.href = destinationFor(session.user);
}

/* ---------------------------------------------------------- role switching */

const doorPatient = document.getElementById('doorPatient');
const doorDoctor = document.getElementById('doorDoctor');
const patientArea = document.getElementById('patientArea');
const doctorArea = document.getElementById('doctorArea');

function selectRole(role) {
  const isPatient = role === 'patient';
  doorPatient.setAttribute('aria-pressed', String(isPatient));
  doorDoctor.setAttribute('aria-pressed', String(!isPatient));
  patientArea.classList.toggle('hidden', !isPatient);
  doctorArea.classList.toggle('hidden', isPatient);
}
doorPatient.addEventListener('click', () => selectRole('patient'));
doorDoctor.addEventListener('click', () => selectRole('doctor'));

// A link like login.html?role=doctor opens straight on the clinician door.
if (params.get('role') === 'doctor') selectRole('doctor');

/* -------------------------------------------------------------- tab logic */

function wireTabs(tabA, tabB, panelA, panelB) {
  const a = document.getElementById(tabA);
  const b = document.getElementById(tabB);
  const pa = document.getElementById(panelA);
  const pb = document.getElementById(panelB);
  const select = (first) => {
    a.setAttribute('aria-selected', String(first));
    b.setAttribute('aria-selected', String(!first));
    pa.classList.toggle('hidden', !first);
    pb.classList.toggle('hidden', first);
  };
  a.addEventListener('click', () => select(true));
  b.addEventListener('click', () => select(false));
}
wireTabs('tabLogin', 'tabRegister', 'loginPanel', 'registerPanel');
wireTabs('dTabLogin', 'dTabRegister', 'dLoginPanel', 'dRegisterPanel');

// After the listeners are in place, a link like
// login.html?role=doctor&tab=register can land directly on the form.
if (params.get('tab') === 'register') {
  if (params.get('role') === 'doctor') {
    document.getElementById('dTabRegister').click();
  } else {
    document.getElementById('tabRegister').click();
  }
}

/* --------------------------------------------------------------- sign-in */

async function handleSignIn(formId, emailId, passwordId, errorId, buttonId, thisRole) {
  const form = document.getElementById(formId);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = document.getElementById(buttonId);
    const errorEl = document.getElementById(errorId);
    errorEl.classList.add('hidden');

    const email = document.getElementById(emailId).value.trim();
    const password = document.getElementById(passwordId).value;
    if (!email || !password) {
      errorEl.textContent = i18n.t('auth.invalid');
      errorEl.classList.remove('hidden');
      return;
    }

    setBusy(button, true);
    try {
      const user = await api.login(email, password);
      const role = user?.role;

      // Wrong door for this account? Move them to the right one rather than
      // dumping a clinician on the patient home page.
      if (!next && thisRole === 'patient' && (role === 'DOCTOR' || role === 'ADMIN')) {
        toast(i18n.t('auth.useYourPortal'), 'info');
        if (role === 'DOCTOR') selectRole('doctor');
        else window.location.href = 'staff-portal.html';
        return;
      }
      if (!next && thisRole === 'doctor' && role === 'PATIENT') {
        toast(i18n.t('auth.useYourPortal'), 'info');
        selectRole('patient');
        return;
      }

      toast(i18n.t('status.saved'), 'success');
      window.location.href = destinationFor(user);
    } catch (error) {
      errorEl.textContent = error.status === 401 || error.status === 400
        ? i18n.t('auth.invalid')
        : error.message;
      errorEl.classList.remove('hidden');
    } finally {
      setBusy(button, false);
    }
  });
}
handleSignIn('loginForm', 'loginEmail', 'loginPassword', 'loginError', 'loginBtn', 'patient');
handleSignIn('dLoginForm', 'dLoginEmail', 'dLoginPassword', 'dLoginError', 'dLoginBtn', 'doctor');

/* ----------------------------------------------------------- sign-up */

document.getElementById('registerForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('registerBtn');
  const errorEl = document.getElementById('registerError');
  errorEl.classList.add('hidden');

  const payload = {
    full_name: document.getElementById('regName').value.trim(),
    email: document.getElementById('regEmail').value.trim(),
    phone: document.getElementById('regPhone').value.trim(),
    password: document.getElementById('regPassword').value,
  };

  if (!/^01[3-9]\d{8}$/.test(payload.phone)) {
    errorEl.textContent = i18n.t('account.phoneInvalid');
    errorEl.classList.remove('hidden');
    return;
  }
  if (payload.password.length < 8) {
    errorEl.textContent = i18n.t('auth.passwordTooShort');
    errorEl.classList.remove('hidden');
    return;
  }

  setBusy(button, true);
  try {
    await api.register(payload);
    const user = await api.login(payload.email, payload.password);
    toast(i18n.t('status.saved'), 'success');
    window.location.href = destinationFor(user);
  } catch (error) {
    errorEl.textContent = error.message;
    errorEl.classList.remove('hidden');
  } finally {
    setBusy(button, false);
  }
});

document.getElementById('dRegisterForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('dRegisterBtn');
  const errorEl = document.getElementById('dRegisterError');
  errorEl.classList.add('hidden');

  const payload = {
    full_name: document.getElementById('dRegName').value.trim(),
    email: document.getElementById('dRegEmail').value.trim(),
    phone: document.getElementById('dRegPhone').value.trim(),
    password: document.getElementById('dRegPassword').value,
    bmdc_number: document.getElementById('dRegBmdc').value.trim(),
    specialization: document.getElementById('dRegSpec').value.trim(),
    hospital_name: document.getElementById('dRegHospital').value.trim(),
  };

  if (!/^01[3-9]\d{8}$/.test(payload.phone)) {
    errorEl.textContent = i18n.t('account.phoneInvalid');
    errorEl.classList.remove('hidden');
    return;
  }
  if (payload.password.length < 8) {
    errorEl.textContent = i18n.t('auth.passwordTooShort');
    errorEl.classList.remove('hidden');
    return;
  }
  if (payload.bmdc_number.length < 4) {
    errorEl.textContent = i18n.t('auth.bmdcInvalid');
    errorEl.classList.remove('hidden');
    return;
  }

  setBusy(button, true);
  try {
    await api.post('/auth/register-doctor', payload, { auth: false });
    // Straight in, same as the patient flow; the dashboard shows what is
    // still locked while the BMDC number waits for verification.
    const user = await api.login(payload.email, payload.password);
    toast(i18n.t('auth.doctorPending'), 'info');
    window.location.href = destinationFor(user);
  } catch (error) {
    errorEl.textContent = error.message;
    errorEl.classList.remove('hidden');
  } finally {
    setBusy(button, false);
  }
});
</script>
</body>
</html>
