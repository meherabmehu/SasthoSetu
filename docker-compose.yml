# Local and staging stack: PostgreSQL, the API, and nginx serving the frontend.
#
#   cp .env.example .env   (then set SECRET_KEY and POSTGRES_PASSWORD)
#   docker compose up --build
#
# The application is then reachable on http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sasthosetu}
      POSTGRES_USER: ${POSTGRES_USER:-sasthosetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sasthosetu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the API needs to reach the database.
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sasthosetu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sasthosetu}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-0.02}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      SEED_ON_START: ${SEED_ON_START:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      BKASH_API_KEY: ${BKASH_API_KEY:-}
      BKASH_API_SECRET: ${BKASH_API_SECRET:-}
      NAGAD_API_KEY: ${NAGAD_API_KEY:-}
      NAGAD_API_SECRET: ${NAGAD_API_SECRET:-}
    volumes:
      # Datasets and trained models survive a rebuild, so a redeploy does not
      # retrain from scratch.
      - ai-artifacts:/app/backend/app/ai/artifacts
      - ai-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  ai-artifacts:
  ai-data:
